<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin Day</title>
    <meta name="description" content="Benjamin Day — Social Media Manager & Crypto Marketing Strategist. Links and contact.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #2c2c2c;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            width: 96px;
            height: auto;
            margin: 0 auto 1.5rem;
            display: block;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
            color: #000;
        }

        .bio {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 2.2rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .link {
            display: block;
            padding: 0.9rem 1.5rem;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            text-decoration: none;
            color: #000;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .link:hover {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .link.primary {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .link.primary:hover {
            background: #333;
            border-color: #333;
        }

        footer {
            margin-top: 3rem;
            color: #aaa;
            font-size: 0.78rem;
        }

        footer p {
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="logo.svg" alt="Benjamin Day (BD) logo">
        <h1>Benjamin Day</h1>
        <p class="bio">Social Media Manager &amp; Crypto Marketing Strategist. 15+ years building brands, audiences, and communities across web3, DeFi, and consumer products. Based in Toronto, Canada.</p>

        <div class="links">
            <a class="link primary" href="https://x.com/BenniDaytime" target="_blank" rel="noopener noreferrer">X / Twitter</a>
            <a class="link" href="https://www.linkedin.com/in/bennidaytime/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a class="link" href="https://www.instagram.com/bennidaytime/" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a class="link" href="https://www.tiktok.com/@bennidaytime" target="_blank" rel="noopener noreferrer">TikTok</a>
            <a class="link" href="https://www.twitch.tv/bennidaytime" target="_blank" rel="noopener noreferrer">Twitch</a>
            <a class="link" href="mailto:benni@daytimex.com">Email</a>
        </div>

        <footer>
            <p>Toronto, Canada</p>
            <p>&copy; 2026 Benjamin Day</p>
        </footer>
    </div>
</body>
</html>
